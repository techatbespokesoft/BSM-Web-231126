<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" role="img" aria-label="Scatter plot, illustrative: 46 channel segments cluster along an average return line, one segment returns far above the rest."><style>.sig{fill:#2AA880}
.ctx{fill:#6A6A6A}
