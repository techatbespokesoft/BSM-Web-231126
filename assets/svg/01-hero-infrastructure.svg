<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -60 560 520" role="img" aria-label="Diagram: three stacked infrastructure layers, Intelligence, Systems and Demand, with revenue rising from the top layer"><style>.sig{fill:#2AA880}
.ctx{fill:#6A6A6A}
