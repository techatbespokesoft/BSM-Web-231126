<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 320" role="img" aria-label="Line chart, illustrative: campaign-led revenue spikes and decays four times over 24 months, while infrastructure-led revenue compounds steadily and finishes far higher."><style>.sig{fill:#0E8A63}
.ctx{fill:#B0B0B0}
.ring{stroke:#FFFFFF;stroke-width:2}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.sig-s{stroke:#0E8A63}
.ctx-s{stroke:#B0B0B0}
.grd{stroke:rgba(10,10,10,0.10);stroke-width:1}
.grd.base{stroke:#6B6B6B;opacity:.6}
.tick{font:11px "JetBrains Mono",monospace;fill:#6B6B6B}
.tick.ink{font:13px "Inter Tight",sans-serif;fill:#0A0A0A}
.dl{font:500 13px "Inter Tight",sans-serif;fill:#0A0A0A}
.dl.mut{fill:#6B6B6B;font-weight:400}
.hit{fill:transparent;cursor:crosshair}
.xhair{stroke:#6B6B6B;stroke-dasharray:3 3;transition:opacity .1s}
.trend{stroke:#6B6B6B;stroke-dasharray:4 4;stroke-width:1.5}
.halo{fill:none;stroke:#0E8A63;stroke-width:1.5;opacity:.5}
.leader{stroke:#6B6B6B;stroke-width:1}
.area{fill:#0E8A63;opacity:.12}
.edge{stroke:#6B6B6B;stroke-width:1.2;opacity:.55}
.node{fill:#0A0A0A}
.gdot{fill:#6B6B6B;opacity:.3}
.arc{fill:none;stroke:#0E8A63;stroke-width:1.5;stroke-dasharray:4 4;opacity:.85}
.lbl{font:500 15px "Inter Tight",sans-serif;fill:#0A0A0A}
.code{font:10px "JetBrains Mono",monospace;fill:#6B6B6B;letter-spacing:.1em}
.face{fill:#0F0F0F;stroke:rgba(255,255,255,.32);stroke-width:1}
.p2 .face{fill:#161616;stroke:rgba(255,255,255,.65)}
.side-l{fill:#121212;stroke:rgba(255,255,255,.18)}
.side-r{fill:#1B1B1B;stroke:rgba(255,255,255,.18)}
.pgrid{stroke:rgba(255,255,255,.08)}
.sigline{fill:none;stroke:#0E8A63;stroke-width:2.5;stroke-linecap:round}
.sigdot{fill:#0E8A63}
</style>
